name: Inspect pinned upstream checkpoint

on: workflow_dispatch

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect public artifact without compiling or extracting its tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/inspect-upstream-checkpoint.py
      - name: Record selected configuration in job logs
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          root = Path('build/reuse-qualification')
          for name in ('src__out__Default__args.gn',
                       'src__third_party__llvm-build__Release+Asserts__cr_build_revision'):
              path = root / name
              if path.exists():
                  print(name + ':')
                  print(path.read_text()[:20000])
          PYTHON
