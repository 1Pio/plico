name: Qualify upstream checkpoint on matching macOS SDK

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Dependency graph to diagnose without compilation
        required: true
        type: choice
        default: objects
        options:
          - objects
          - browser
      profile_memory:
        description: Capture bounded Siso heap profiles to diagnose its memory use
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      PYTHON_CPU_COUNT: '1'
      GRIT_DISABLE_MULTIPROCESSING: '1'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1536MiB
      SISO_LIMITS: step=16,preproc=2,scandeps=1,thread=8,cache=4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm matching SDK and sufficient disk space
        run: |
          test "$(uname -m)" = arm64
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.0
          test "$(xcrun --sdk macosx --show-sdk-build-version)" = 25A352
          df -h "$RUNNER_TEMP"
          mkdir -p build/logs
      - name: Check heap reader before restoring the large checkpoint
        if: inputs.profile_memory
        run: python3 scripts/test-heap-profile.py
      - name: Verify exact upstream checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/inspect-upstream-checkpoint.py
      - name: Restore object probe without external links, link cache or debug symbols
        run: python3 scripts/restore-upstream-checkpoint.py --object-probe
      - name: Recreate original input paths only on the disposable runner
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$(id -un)" = runner
          python3 - <<'PYTHON'
          import os, subprocess
          from pathlib import Path
          source = Path('build/reuse-qualification/restored/src').resolve(strict=True)
          original = Path('/Users/runner/work/helium-macos/helium-macos/build/src')
          original.parent.mkdir(parents=True, exist_ok=True)
          if os.path.lexists(original):
              if original.resolve(strict=True) != source:
                  raise RuntimeError('Existing source path has a different target; refusing replacement')
          else:
              original.symlink_to(source, target_is_directory=True)
          xcode = Path('/Applications/Xcode_26.0.1.app').resolve(strict=True)
          original_xcode = Path('/Applications/Xcode_26.app')
          if os.path.lexists(original_xcode):
              if original_xcode.resolve(strict=True) != xcode:
                  raise RuntimeError('Existing Xcode path differs; refusing replacement')
          else:
              subprocess.run(['sudo', 'ln', '-s', str(xcode), str(original_xcode)], check=True)
          assert original.resolve(strict=True) == source
          assert original_xcode.resolve(strict=True) == xcode
          print('Original source and exact-version Xcode paths resolve to the verified inputs')
          PYTHON
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.app/Contents/Developer' >> "$GITHUB_ENV"
          test "$(DEVELOPER_DIR=/Applications/Xcode_26.app/Contents/Developer xcrun --sdk macosx --show-sdk-build-version)" = 25A352
      - name: Preserve selected original manifests for comparison
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          out = Path('build/reuse-qualification/restored/src/out/Default')
          names = ['args.gn', 'toolchain.ninja', 'obj/base/base.ninja',
                   'obj/ui/gfx/geometry/geometry.ninja', 'obj/net/net.ninja']
          snapshot = {name: (out / name).read_text() for name in names}
          Path('build/reuse-qualification/original-manifests.json').write_text(json.dumps(snapshot))
          PYTHON
      - name: Recover timestamp precision only for hash-verified archived objects
        run: python3 scripts/restore-checkpoint-object-times.py --apply
      - name: Regenerate manifest under a bounded memory guard
        working-directory: build/reuse-qualification/restored/src
        run: |
          ROOT="$GITHUB_WORKSPACE"
          python3 "$ROOT/scripts/memory-guard.py" \
            --log "$ROOT/build/logs/cloud-gn-memory.jsonl" \
            --max-build-mib 3072 --max-runtime-seconds 300 -- \
            buildtools/mac/gn gen out/Default --fail-on-unused-args
      - name: Compare regenerated manifest content
        run: |
          python3 - <<'PYTHON'
          import difflib, hashlib, json
          from pathlib import Path
          out = Path('build/reuse-qualification/restored/src/out/Default')
          snapshot = json.loads(Path('build/reuse-qualification/original-manifests.json').read_text())
          for name, before in snapshot.items():
              after = (out / name).read_text()
              changes = [line for line in difflib.unified_diff(before.splitlines(), after.splitlines(), n=0)
                         if line.startswith(('+', '-')) and not line.startswith(('+++', '---'))]
              print(json.dumps({'manifest': name, 'identical': before == after,
                                'original_sha256': hashlib.sha256(before.encode()).hexdigest(),
                                'regenerated_sha256': hashlib.sha256(after.encode()).hexdigest(),
                                'changed_lines': len(changes), 'sample': [s[:500] for s in changes[:8]]}))
          PYTHON
      - name: Diagnose selected retained dependency graph without compiling
        env:
          PROBE_SCOPE: ${{ inputs.scope }}
          PROFILE_MEMORY: ${{ inputs.profile_memory }}
        working-directory: build/reuse-qualification/restored/src
        run: |
          ROOT="$GITHUB_WORKSPACE"
          case "$PROBE_SCOPE" in
            objects) targets=(obj/base/base/string_util.o obj/ui/gfx/geometry/geometry/rect.o obj/net/net/net_errors.o) ;;
            browser) targets=(chrome chromedriver) ;;
            *) echo 'Unknown probe scope' >&2; exit 2 ;;
          esac
          profile_flags=()
          case "$PROFILE_MEMORY" in
            true) profile_flags=(-memprofile="$ROOT/build/reuse-qualification/siso-memory.pprof" -memprofile_interval=5s -memprofile_gc=false) ;;
            false) ;;
            *) echo 'Unknown memory profile option' >&2; exit 2 ;;
          esac
          python3 "$ROOT/scripts/memory-guard.py" \
            --log "$ROOT/build/logs/cloud-dryrun-memory.jsonl" \
            --max-build-mib 3072 --max-runtime-seconds 300 -- \
            third_party/siso/cipd/siso "${profile_flags[@]}" ninja -offline -n -C out/Default \
            -local_jobs=1 -fs_state_compression_threads=1 -d explain \
            "${targets[@]}" \
            > "$ROOT/build/reuse-qualification/cloud-dryrun.log" 2>&1
      - name: Retain bounded evidence in logs only
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json
          from collections import deque, Counter
          from pathlib import Path
          for name in ('cloud-gn-memory.jsonl', 'cloud-dryrun-memory.jsonl'):
              path = Path('build/logs') / name
              if path.exists():
                  rows = [json.loads(line) for line in path.read_text().splitlines()]
                  print(name, json.dumps({'peak_mib': max((r.get('build_mib', 0) for r in rows), default=0), 'last_samples': rows[-2:]}))
          path = Path('build/reuse-qualification/cloud-dryrun.log')
          if path.exists():
              lines = deque(maxlen=20)
              diagnostics = []
              count = 0
              commands = Counter()
              compiler_samples = []
              with path.open(errors='replace') as stream:
                  for line in stream:
                      count += 1
                      line = line.rstrip()
                      if line.startswith('sccache '):
                          commands['compiler_commands'] += 1
                          if len(compiler_samples) < 12:
                              compiler_samples.append(line[-600:])
                      if 'clang++' in line and ' -o ' in line and not line.startswith('ninja explain:'):
                          commands['clang_cpp_lines'] += 1
                      if 'rustc_wrapper.py' in line and not line.startswith('ninja explain:'):
                          commands['rust_commands'] += 1
                      if ('explain:' in line or 'dirty' in line or 'changed' in line) and len(diagnostics) < 35:
                          diagnostics.append(line[:500])
                      lines.append(line[:500])
              print('dry_run_lines', count, 'command_counts', dict(commands))
              print('compiler_samples', json.dumps(compiler_samples))
              print('diagnostics', json.dumps(diagnostics))
              print('\n'.join(lines))
          PYTHON
      - name: Summarize retained heap samples without uploading profiles
        if: always() && inputs.profile_memory
        run: |
          python3 scripts/memory-guard.py \
            --log build/logs/cloud-heap-analysis-memory.jsonl \
            --max-build-mib 3072 --max-runtime-seconds 60 -- \
            python3 scripts/summarize-heap-profile.py build/reuse-qualification
