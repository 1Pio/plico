name: Inspect standard macOS checkpoint compatibility

on: workflow_dispatch

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Record resources and exact SDK availability without building
        shell: bash
        run: |
          uname -m
          sysctl -n hw.memsize hw.logicalcpu
          df -h "$RUNNER_TEMP"
          test -d /Applications/Xcode_26.0.1.app
          DEVELOPER_DIR=/Applications/Xcode_26.0.1.app/Contents/Developer xcodebuild -version
          DEVELOPER_DIR=/Applications/Xcode_26.0.1.app/Contents/Developer xcrun --sdk macosx --show-sdk-version
          DEVELOPER_DIR=/Applications/Xcode_26.0.1.app/Contents/Developer xcrun --sdk macosx --show-sdk-build-version
          du -sh /Applications/Xcode_26.0.1.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
